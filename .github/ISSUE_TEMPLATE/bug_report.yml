name: 报错 / Bug
description: 插件运行时出错、结果不对、或按钮无响应
labels: [bug]
body:
  - type: input
    id: summary
    attributes:
      label: 一句话描述
      placeholder: 例如：点「一键风格」后面板没反应
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 发生了什么 / 期望是什么
      placeholder: 哪个按钮、什么现象、期望结果；有截图更好（可直接拖入）
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境（插件「反馈/报错」按钮会自动带上）
      render: json
      placeholder: |
        {"platform":"darwin","mcp":{"ok":true},"binaries":{"ffmpeg":"/opt/homebrew/bin/ffmpeg"},"pluginVersion":"0.11.0"}
  - type: textarea
    id: log
    attributes:
      label: 调试日志（插件底部「调试日志」可直接复制）
      render: text
  - type: input
    id: contact
    attributes:
      label: 联系方式（可选）
      placeholder: 邮箱 / GitHub 用户名
